name: SDK Integration Tests

on:
  push:
    branches: [ main, dev, vibe/* ]
    paths:
      - 'sdks/**'
      - '.github/workflows/sdk-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'sdks/**'

concurrency:
  group: sdk-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nodejs-sdk:
    name: Node.js SDK Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          mkdir -p zig-install
          tar -xf zig.tar.xz -C zig-install --strip-components=1
          echo "$(pwd)/zig-install" >> $GITHUB_PATH
          rm zig.tar.xz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libmbedtls-dev

      - name: Build Sweef binary
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js SDK
        working-directory: sdks/nodejs
        run: npm install

      - name: Run Node.js SDK tests
        working-directory: sdks/nodejs
        run: |
          echo "=== Node.js SDK Tests ==="
          
          # Test 1: Basic browser launch
          echo "Test 1: Browser launch..."
          node -e "
            const { Browser } = require('./index');
            (async () => {
              try {
                const browser = await Browser.launch({ headless: true, debug: true });
                console.log('✅ Test 1: Browser launched');
                await browser.close();
              } catch (e) {
                console.error('❌ Test 1 failed:', e.message);
                process.exit(1);
              }
            })();
          " 2>&1
          
          # Test 2: Page creation
          echo "Test 2: Page creation..."
          node -e "
            const { Browser } = require('./index');
            (async () => {
              try {
                const browser = await Browser.launch({ headless: true });
                const page = await browser.newPage();
                console.log('✅ Test 2: Page created');
                await browser.close();
              } catch (e) {
                console.error('❌ Test 2 failed:', e.message);
                process.exit(1);
              }
            })();
          " 2>&1
          
          # Test 3: Navigation
          echo "Test 3: Navigation..."
          node -e "
            const { Browser } = require('./index');
            (async () => {
              try {
                const browser = await Browser.launch({ headless: true });
                const page = await browser.newPage();
                await page.goto('about:blank');
                console.log('✅ Test 3: Navigation works');
                await browser.close();
              } catch (e) {
                console.error('❌ Test 3 failed:', e.message);
                process.exit(1);
              }
            })();
          " 2>&1
          
          # Test 4: JavaScript evaluation
          echo "Test 4: JavaScript evaluation..."
          node -e "
            const { Browser } = require('./index');
            (async () => {
              try {
                const browser = await Browser.launch({ headless: true });
                const page = await browser.newPage();
                const result = await page.evaluate('() => 1 + 1');
                if (result === 2) {
                  console.log('✅ Test 4: JavaScript evaluation works');
                } else {
                  console.error('❌ Test 4 failed: Expected 2, got', result);
                  process.exit(1);
                }
                await browser.close();
              } catch (e) {
                console.error('❌ Test 4 failed:', e.message);
                process.exit(1);
              }
            })();
          " 2>&1
          
          # Test 5: DOM manipulation
          echo "Test 5: DOM manipulation..."
          node -e "
            const { Browser } = require('./index');
            (async () => {
              try {
                const browser = await Browser.launch({ headless: true });
                const page = await browser.newPage();
                await page.setContent('<html><body><h1>Test</h1></body></html>');
                const title = await page.$('h1');
                if (title) {
                  console.log('✅ Test 5: DOM manipulation works');
                } else {
                  console.error('❌ Test 5 failed: Could not find h1 element');
                  process.exit(1);
                }
                await browser.close();
              } catch (e) {
                console.error('❌ Test 5 failed:', e.message);
                process.exit(1);
              }
            })();
          " 2>&1
          
          echo "=== All Node.js SDK tests passed ==="

      - name: Upload Node.js test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodejs-sdk-results
          path: |
            sdks/nodejs/

  test-python-sdk:
    name: Python SDK Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          mkdir -p zig-install
          tar -xf zig.tar.xz -C zig-install --strip-components=1
          echo "$(pwd)/zig-install" >> $GITHUB_PATH
          rm zig.tar.xz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libmbedtls-dev

      - name: Build Sweef binary
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK
        working-directory: sdks/python
        run: |
          pip install -e .

      - name: Run Python SDK tests
        run: |
          echo "=== Python SDK Tests ==="
          
          # Test 1: Basic browser launch
          echo "Test 1: Browser launch..."
          python3 -c "
            import asyncio
            from sweef import Browser
            
            async def test():
                try:
                    browser = await Browser.launch(headless=True)
                    print('✅ Test 1: Browser launched')
                    await browser.close()
                except Exception as e:
                    print(f'❌ Test 1 failed: {e}')
                    raise
            
            asyncio.run(test())
          " 2>&1
          
          # Test 2: Page creation
          echo "Test 2: Page creation..."
          python3 -c "
            import asyncio
            from sweef import Browser
            
            async def test():
                try:
                    browser = await Browser.launch(headless=True)
                    page = await browser.new_page()
                    print('✅ Test 2: Page created')
                    await browser.close()
                except Exception as e:
                    print(f'❌ Test 2 failed: {e}')
                    raise
            
            asyncio.run(test())
          " 2>&1
          
          # Test 3: Navigation
          echo "Test 3: Navigation..."
          python3 -c "
            import asyncio
            from sweef import Browser
            
            async def test():
                try:
                    browser = await Browser.launch(headless=True)
                    page = await browser.new_page()
                    await page.goto('about:blank')
                    print('✅ Test 3: Navigation works')
                    await browser.close()
                except Exception as e:
                    print(f'❌ Test 3 failed: {e}')
                    raise
            
            asyncio.run(test())
          " 2>&1
          
          # Test 4: JavaScript evaluation
          echo "Test 4: JavaScript evaluation..."
          python3 -c "
            import asyncio
            from sweef import Browser
            
            async def test():
                try:
                    browser = await Browser.launch(headless=True)
                    page = await browser.new_page()
                    result = await page.evaluate('() => 1 + 1')
                    if result == 2:
                        print('✅ Test 4: JavaScript evaluation works')
                    else:
                        print(f'❌ Test 4 failed: Expected 2, got {result}')
                        raise Exception('Unexpected result')
                    await browser.close()
                except Exception as e:
                    print(f'❌ Test 4 failed: {e}')
                    raise
            
            asyncio.run(test())
          " 2>&1
          
          # Test 5: DOM manipulation
          echo "Test 5: DOM manipulation..."
          python3 -c "
            import asyncio
            from sweef import Browser
            
            async def test():
                try:
                    browser = await Browser.launch(headless=True)
                    page = await browser.new_page()
                    await page.set_content('<html><body><h1>Test</h1></body></html>')
                    title = await page.query_selector('h1')
                    if title:
                        print('✅ Test 5: DOM manipulation works')
                    else:
                        print('❌ Test 5 failed: Could not find h1 element')
                        raise Exception('Element not found')
                    await browser.close()
                except Exception as e:
                    print(f'❌ Test 5 failed: {e}')
                    raise
            
            asyncio.run(test())
          " 2>&1
          
          echo "=== All Python SDK tests passed ==="

      - name: Upload Python test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-sdk-results
          path: |
            sdks/python/

  test-mcp-integration:
    name: MCP Protocol Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          mkdir -p zig-install
          tar -xf zig.tar.xz -C zig-install --strip-components=1
          echo "$(pwd)/zig-install" >> $GITHUB_PATH
          rm zig.tar.xz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libmbedtls-dev

      - name: Build Sweef binary
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Test MCP server
        run: |
          echo "=== MCP Protocol Tests ==="
          
          # Start MCP server in background
          ./core/zig-out/bin/sweef --headless --mcp --mcp-port 3002 &
          MCP_PID=$!
          
          # Wait for server to start
          sleep 2
          
          # Test MCP connection
          echo "Test 1: MCP server starts..."
          if ps -p $MCP_PID > /dev/null; then
            echo "✅ Test 1: MCP server is running"
          else
            echo "❌ Test 1 failed: MCP server did not start"
            kill $MCP_PID 2>/dev/null
            exit 1
          fi
          
          # Test MCP JSON-RPC
          echo "Test 2: MCP JSON-RPC communication..."
          RESPONSE=$(echo '{"id":1,"method":"browser.version"}' | nc -w 5 localhost 3002 2>&1 || true)
          if echo "$RESPONSE" | grep -q "version"; then
            echo "✅ Test 2: MCP JSON-RPC works"
          else
            echo "❌ Test 2 failed: No response or invalid response"
            echo "Response: $RESPONSE"
          fi
          
          # Clean up
          kill $MCP_PID 2>/dev/null
          wait $MCP_PID 2>/dev/null
          
          echo "=== MCP tests completed ==="

  test-memory-usage:
    name: Memory Usage Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          mkdir -p zig-install
          tar -xf zig.tar.xz -C zig-install --strip-components=1
          echo "$(pwd)/zig-install" >> $GITHUB_PATH
          rm zig.tar.xz

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libmbedtls-dev

      - name: Build Sweef binary
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Test memory usage
        run: |
          echo "=== Memory Usage Validation ==="
          
          # Start browser in background
          ./core/zig-out/bin/sweef --headless --mcp --mcp-port 3003 &
          BROWSER_PID=$!
          
          # Wait for startup
          sleep 2
          
          # Monitor memory for 5 seconds
          MAX_MEMORY=0
          for i in {1..5}; do
            MEM_RSS=$(ps -p $BROWSER_PID -o rss= | tail -1 | tr -d ' ')
            if [ "$MEM_RSS" -gt "$MAX_MEMORY" ]; then
              MAX_MEMORY=$MEM_RSS
            fi
            sleep 1
          done
          
          echo "Peak memory usage: ${MAX_MEMORY} KB"
          
          # Convert to MB
          MEM_MB=$(echo "scale=2; $MAX_MEMORY / 1024" | bc)
          echo "Peak memory usage: ${MEM_MB} MB"
          
          # Check against target (50MB)
          if [ "$MAX_MEMORY" -lt 51200 ]; then
            echo "✅ Memory usage is under 50MB target"
          else
            echo "❌ Memory usage exceeds 50MB target"
            echo "::error::Memory usage exceeds 50MB target (${MEM_MB} MB)"
            kill $BROWSER_PID 2>/dev/null
            exit 1
          fi
          
          # Clean up
          kill $BROWSER_PID 2>/dev/null
          wait $BROWSER_PID 2>/dev/null
          
          echo "=== Memory validation completed ==="

  test-binary-size:
    name: Binary Size Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        run: |
          curl -L https://ziglang.org/builds/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          mkdir -p zig-install
          tar -xf zig.tar.xz -C zig-install --strip-components=1
          echo "$(pwd)/zig-install" >> $GITHUB_PATH
          rm zig.tar.xz

      - name: Build Sweef binary
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe

      - name: Check binary size
        run: |
          echo "=== Binary Size Validation ==="
          
          BINARY_PATH="./core/zig-out/bin/sweef"
          BINARY_SIZE=$(stat -c%s "$BINARY_PATH" 2>/dev/null || stat -f%z "$BINARY_PATH" 2>/dev/null)
          
          if [ -z "$BINARY_SIZE" ]; then
            echo "❌ Could not determine binary size"
            exit 1
          fi
          
          SIZE_MB=$(echo "scale=2; $BINARY_SIZE / 1024 / 1024" | bc)
          
          echo "Binary size: ${BINARY_SIZE} bytes (${SIZE_MB} MB)"
          
          # Check against target (10MB)
          if [ "$BINARY_SIZE" -lt 10485760 ]; then
            echo "✅ Binary size is under 10MB target"
          else
            echo "⚠️  Binary size exceeds 10MB (${SIZE_MB} MB)"
            echo "::warning::Binary size exceeds 10MB target (${SIZE_MB} MB)"
          fi
          
          # Also check stripped size
          STRIPPED_SIZE=$(strip -o /tmp/sweef-stripped "$BINARY_PATH" 2>/dev/null && stat -c%s /tmp/sweef-stripped 2>/dev/null || echo "0")
          if [ "$STRIPPED_SIZE" != "0" ]; then
            STRIPPED_MB=$(echo "scale=2; $STRIPPED_SIZE / 1024 / 1024" | bc)
            echo "Stripped binary size: ${STRIPPED_SIZE} bytes (${STRIPPED_MB} MB)"
          fi
          
          echo "=== Binary size validation completed ==="
